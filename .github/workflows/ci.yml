name: Application checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ortho
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ortho_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ortho"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ortho:ci-only-password@localhost:5432/ortho_test
      TEST_DATABASE_URL: postgresql://ortho:ci-only-password@localhost:5432/ortho_test
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
